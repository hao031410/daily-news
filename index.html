<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>每日新闻 - 60s & AI 资讯</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>📰 每日新闻</h1>
        <nav>
            <a href="index.html" class="active">今日</a>
            <a href="history.html">历史</a>
        </nav>
    </header>

    <main>
        <div class="tabs">
            <button class="tab-btn active" data-tab="news">60s 看世界</button>
            <button class="tab-btn" data-tab="ai">AI 资讯</button>
        </div>

        <div id="news-tab" class="tab-content active">
            <div class="date-info" id="news-date"></div>
            <div class="loading" id="news-loading">加载中...</div>
            <div class="news-list" id="news-list"></div>
        </div>

        <div id="ai-tab" class="tab-content">
            <div class="date-info" id="ai-date"></div>
            <div class="loading" id="ai-loading">加载中...</div>
            <div class="news-list" id="ai-list"></div>
        </div>
    </main>

    <footer>
        <p>数据来源: <a href="https://60s.viki.moe" target="_blank">60s API</a> | 
           <a href="https://github.com/hao031410/daily-news" target="_blank">GitHub</a></p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
